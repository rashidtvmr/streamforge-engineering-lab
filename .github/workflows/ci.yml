name: StreamForge CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned direct dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit, property, HTTP integration and React component tests
        run: npm run test
      - name: Production build
        run: npm run build
      - name: Bundle budgets
        run: npm run check:bundle
      - name: Generate coverage
        run: npm run test:coverage
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: streamforge-coverage
          path: coverage/
          if-no-files-found: ignore

  browser:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run full browser journeys and accessibility audit
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: streamforge-playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore

  container:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build production container
        run: docker build -t streamforge:ci .
      - name: Smoke-test production server and static app
        run: |
          docker run --rm -d --name streamforge-ci -p 127.0.0.1:4000:4000 streamforge:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4000/api/health >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:4000/api/health
          curl -fsS http://127.0.0.1:4000/ | grep -q '<html'
      - name: Stop container
        if: ${{ always() }}
        run: docker stop streamforge-ci || true
